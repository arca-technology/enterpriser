<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENTERPRISER • Sem conexão</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#0a0e17;color:#e6ecf5;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  main{max-width:360px}
  .logo{width:64px;height:64px;margin:0 auto 18px;border-radius:14px;background:#fff url(/pwa/icon-192.png) center/cover}
  h1{margin:0 0 6px;font-size:18px}
  p{margin:0 0 20px;color:#8a97ad}
  button{border:0;border-radius:8px;background:#2f6bd8;color:#fff;font:inherit;font-weight:700;padding:10px 22px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"></div>
  <h1>Sem conexão com a internet</h1>
  <p>O ENTERPRISER precisa de internet para carregar os dados. Verifique a conexão e tente de novo.</p>
  <button type="button" onclick="location.href='/cms'">Tentar novamente</button>
</main>
</body>
</html>
